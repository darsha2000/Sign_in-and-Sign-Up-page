<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUP and SignIn</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</body>
</html>
</head>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<body>
    <div class="card">

    <div id="signup-view">
      <h1>Signup</h1>
      <div class="field"><label>Email:</label><input id="signup-email" type="email" placeholder="you@gmail.com"></div>
      <div class="field"><label>Password:</label><input id="signup-password" type="password" placeholder="password"></div>
      <div class="field"><label>Name:</label><input id="signup-name" type="text" placeholder="Name"></div>
      <button class="btn" onclick="signupbutton()">Signup</button>
      <p class="footer-text">Already have an account? <span onclick="showSignin()">Sign In</span></p>
    </div>

    <div id="signin-view" class="hidden">
      <h1>Sign In</h1>
      <div class="field"><label>Email:</label><input id="signin-email" type="email" placeholder="you@gmail.com"></div>
      <div class="field"><label>Password:</label><input id="signin-password" type="password" placeholder="password"></div>
      <button class="btn" onclick="signinbutton()">Sign In</button>
      <p class="footer-text">Don't have an account? <span onclick="showSignup()">Signup</span></p>
    </div>

  </div>
</body>
</html>
